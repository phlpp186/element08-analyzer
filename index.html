<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // FOUC prevention — resolve the theme before first paint. An explicit
      // stored choice ('light' = Caribbean / 'mid' = Misty / 'dark' = Chalk
      // Dark) wins; anything else (no preference, or a retired value like
      // 'neon'/'sky') falls back to the OS prefers-color-scheme (light/dark).
      (function () {
        var t = null;
        try { t = localStorage.getItem('element08.theme'); } catch (e) { /* localStorage blocked */ }
        if (t === 'mid') { document.documentElement.classList.add('mid'); return; }
        var light = (t === 'light' || t === 'dark')
          ? t === 'light'
          : !(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (light) document.documentElement.classList.add('light');
      })();
    </script>
    <meta
      name="description"
      content="ELEMENT | 08 Analyzer: professional freediving analytics in your browser. Your data never leaves your device."
    />
    <title>ELEMENT | 08 Analyzer</title>
    <script>
      // Companion to public/404.html — if we arrived via a deep-link
      // bounce, reconstruct the original path/query for the SPA router.
      (function () {
        var p = new URLSearchParams(window.location.search);
        var path = p.get('p');
        if (path !== null) {
          var rest = p.get('q') ? '?' + p.get('q') : '';
          window.history.replaceState(null, '', '/' + path + rest + window.location.hash);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
